<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <style>
    :root {
      --bg: #FAF9F6;
      --card-bg: #F3F1EC;
      --border: #E6E1D8;
      --text: #18181B;
      --accent: #D94E1F;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #121110;
        --card-bg: #1A1917;
        --border: #2E2B28;
        --text: #F4F1EA;
        --accent: #E05A2B;
      }
    }
    .tile { fill: var(--card-bg); stroke: var(--border); stroke-width: 1.2; }
    .cap { fill: var(--text); }
    .chunk { fill: var(--accent); }
    .aperture { fill: var(--card-bg); }
  </style>
  <!-- Squircle container tile for crisp contrast across all browser tab themes -->
  <rect class="tile" x="1" y="1" width="30" height="30" rx="8"/>
  <!-- Top Chunk Cap -->
  <path class="cap" d="M 8.5 11 C 10.2 7 13 5.5 16 5.5 C 19 5.5 21.8 7 23.5 11 L 8.5 11 Z"/>
  <!-- Inspected Center Chunk Capsule -->
  <rect class="chunk" x="5.5" y="13.5" width="21" height="5" rx="2.5"/>
  <!-- Optical Focal Aperture -->
  <circle class="aperture" cx="16" cy="16" r="1.8"/>
  <!-- Bottom Chunk Cap -->
  <path class="cap" d="M 8.5 21 C 10.2 25 13 26.5 16 26.5 C 19 26.5 21.8 25 23.5 21 L 8.5 21 Z"/>
</svg>
